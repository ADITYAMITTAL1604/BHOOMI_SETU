name: BhoomiSetu CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Test & Security Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system spatial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libgdal-dev

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov email-validator

      - name: Seed test database from synthetic CSVs
        run: |
          python db/seed.py --reset --source synthetic
        env:
          DATA_SOURCE: synthetic

      - name: Run Pytest test suite
        run: |
          pytest tests/test_auth.py tests/test_security.py tests/test_workflow.py tests/test_ml.py -v --tb=short

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
